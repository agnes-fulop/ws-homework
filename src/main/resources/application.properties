spring.application.name=homework-api
server.port=8080

# Expose actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Datasource (H2 in-memory — resets on restart)
spring.datasource.url=jdbc:h2:mem:sensorsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# "update" is acceptable for development only — use "validate" + Flyway/Liquibase in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console (development convenience)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serialize dates as ISO-8601 strings, not timestamps
spring.jackson.java-time.write-dates-as-timestamps=false
